<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97A00"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0A84B5"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D64545"/>
    </marker>
  </defs>
  <rect width="880" height="290" fill="#FFFFFF"/>

  <rect x="0" y="0" width="880" height="80" rx="6" fill="#E4F1FB"/>
  <text x="14" y="24" fill="#0A84B5" font-size="13" font-weight="bold">PROD &#183; main</text>
  <rect x="640" y="14" width="210" height="52" rx="7" fill="#FFFFFF" stroke="#2DC5FA" stroke-width="2"/>
  <text x="745" y="45" fill="#212121" font-size="16" font-weight="bold" text-anchor="middle">merge into main</text>

  <rect x="0" y="200" width="880" height="80" rx="6" fill="#F6F0E7"/>
  <text x="14" y="224" fill="#D97A00" font-size="13" font-weight="bold">DEV</text>
  <rect x="60" y="215" width="190" height="50" rx="7" fill="#FFFFFF" stroke="#FFAB40" stroke-width="2"/>
  <text x="155" y="245" fill="#212121" font-size="16" text-anchor="middle">your branch</text>
  <rect x="320" y="215" width="190" height="50" rx="7" fill="#FFFFFF" stroke="#FFAB40" stroke-width="2"/>
  <text x="415" y="245" fill="#212121" font-size="16" text-anchor="middle">pull request</text>
  <line x1="252" y1="240" x2="314" y2="240" stroke="#D97A00" stroke-width="2.5" marker-end="url(#arrow-orange)"/>

  <rect x="560" y="92" width="250" height="96" rx="7" fill="#FFF4E5" stroke="#FFAB40" stroke-width="2"/>
  <text x="685" y="118" fill="#212121" font-size="16" font-weight="bold" text-anchor="middle">Gatekeeper</text>
  <text x="685" y="140" fill="#212121" font-size="14" text-anchor="middle">reviews the changes,</text>
  <text x="685" y="159" fill="#212121" font-size="14" text-anchor="middle">rebuilds the environment,</text>
  <text x="685" y="178" fill="#212121" font-size="14" text-anchor="middle">runs the checks and tests</text>
  <line x1="490" y1="213" x2="555" y2="178" stroke="#D97A00" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <line x1="700" y1="90" x2="725" y2="71" stroke="#0A84B5" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <line x1="125" y1="213" x2="125" y2="86" stroke="#D64545" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-red)"/>
  <circle cx="125" cy="142" r="14" fill="#D64545"/>
  <path d="M119,136 L131,148 M131,136 L119,148" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <text x="150" y="138" fill="#D64545" font-size="14" font-family="Courier New, monospace">git push origin main</text>
  <text x="150" y="156" fill="#D64545" font-size="14" font-weight="bold">blocked</text>
</svg>
